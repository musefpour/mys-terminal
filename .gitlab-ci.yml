# Mys Terminal Management — CI
#
# test     every push and merge request: typecheck + vitest (Linux, no Electron binary needed)
# build    on version tags (v1.2.3), or by hand on main: signed installers per platform
# publish  by hand after a tag build: copies installers + latest*.yml to the update feed
#
# CI/CD variables (Settings → CI/CD → Variables, masked + protected):
#   MYS_UPDATE_URL               update feed base URL baked into the app (MAIN_VITE_UPDATE_URL)
#   macOS signing + notarizing:  MAC_CSC_LINK (base64 .p12, Developer ID Application), MAC_CSC_KEY_PASSWORD,
#                                APPLE_API_KEY_BASE64 (.p8), APPLE_API_KEY_ID, APPLE_API_ISSUER
#   Windows signing:             WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# Without them the jobs still build, just unsigned.

stages:
  - test
  - build
  - publish

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

.npm-cache: &npm-cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .cache/

.release-rules: &release-rules
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    when: manual
    allow_failure: true

test:
  stage: test
  image: node:22-bookworm
  cache: *npm-cache
  variables:
    # Tests run main-process code under Node; the Electron download is not needed.
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  script:
    - npm ci
    - npm run typecheck
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build:linux:
  stage: build
  image: node:22-bookworm
  cache: *npm-cache
  needs: [test]
  rules: *release-rules
  variables:
    MAIN_VITE_UPDATE_URL: "$MYS_UPDATE_URL"
  script:
    - npm ci
    - npm run build
    - npx electron-builder --linux --publish never -c.publish.url="${MYS_UPDATE_URL:-https://updates.invalid/mys-terminal}"
  artifacts:
    expire_in: 30 days
    paths:
      - release/*.AppImage
      - release/*.deb
      - release/latest-linux*.yml

build:windows:
  stage: build
  tags: [windows]
  needs: [test]
  rules: *release-rules
  variables:
    MAIN_VITE_UPDATE_URL: "$MYS_UPDATE_URL"
  script:
    - if ($env:WIN_CSC_LINK) { $env:CSC_LINK = $env:WIN_CSC_LINK; $env:CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD }
    - $feed = if ($env:MYS_UPDATE_URL) { $env:MYS_UPDATE_URL } else { "https://updates.invalid/mys-terminal" }
    - npm ci
    - npm run build
    - npx electron-builder --win --publish never "-c.publish.url=$feed"
  artifacts:
    expire_in: 30 days
    paths:
      - release/*.exe
      - release/*.blockmap
      - release/latest.yml

build:mac:
  stage: build
  tags: [macos]
  needs: [test]
  rules: *release-rules
  variables:
    MAIN_VITE_UPDATE_URL: "$MYS_UPDATE_URL"
  script:
    - |
      if [ -n "$MAC_CSC_LINK" ]; then export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
      if [ -n "$APPLE_API_KEY_BASE64" ]; then
        echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$CI_PROJECT_DIR/apple-api-key.p8"
        export APPLE_API_KEY="$CI_PROJECT_DIR/apple-api-key.p8"
      fi
    - npm ci
    - npm run build
    - npx electron-builder --mac --publish never -c.publish.url="${MYS_UPDATE_URL:-https://updates.invalid/mys-terminal}"
  after_script:
    - rm -f "$CI_PROJECT_DIR/apple-api-key.p8"
  artifacts:
    expire_in: 30 days
    paths:
      - release/*.dmg
      - release/*.zip
      - release/*.blockmap
      - release/latest-mac.yml

# Uploads the tag's installers to GitLab's generic package registry under a fixed
# "latest" version, so MYS_UPDATE_URL can point at
#   $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mys-terminal/latest
# The package must be readable by the app (public project), or serve release/ from your own host instead.
publish:updates:
  stage: publish
  image: curlimages/curl:latest
  needs: [build:linux, build:windows, build:mac]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
      when: manual
  script:
    - |
      for file in release/*; do
        [ -f "$file" ] || continue
        name=$(basename "$file")
        for version in "${CI_COMMIT_TAG#v}" latest; do
          curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mys-terminal/$version/$name"
        done
      done
